# SIMLAB AI — Separate QLoRA Fine-Tuning Configuration (Phase 18)
# IMPORTANT: Do NOT run against Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf directly.
# This pipeline trains a LoRA adapter on the non-quantized HuggingFace base model,
# merges the adapter weights, and exports a new quantized GGUF for offline inference.

base_model: "meta-llama/Meta-Llama-3.1-8B-Instruct"
inference_gguf_protected: "models/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf"
output_adapter_dir: "training/lora_pipeline/checkpoints/simlab-llama3.1-8b-lora"
merged_model_dir: "training/lora_pipeline/checkpoints/simlab-llama3.1-8b-merged"
exported_gguf_path: "models/SimLab-Llama-3.1-8B-Instruct-Q4_K_M.gguf"

dataset:
  train_jsonl: "training/simlab_sft_combined.jsonl"
  regression_jsonl: "training/regression.jsonl"
  max_seq_length: 2048

qlora:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 10
  save_strategy: "epoch"
  bf16: true
